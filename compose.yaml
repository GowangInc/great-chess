# Great Chess deployment.
#
#   docker compose up -d --build
#
# Topology: the backend binds only to host loopback (127.0.0.1:9277) and a
# named Cloudflare tunnel publishes it. Nothing else is exposed publicly.
#
# Deployment files:
#   tunnel-config.yml       - tunnel id + ingress -> http://server:9277 (no secrets)
#   tunnel-credentials.json - Cloudflare tunnel credentials (NEVER commit)
#
# ALLOWED_ORIGINS may be overridden in `.env`; loopback origins are always
# accepted by the server for local development.

name: great-chess

services:
  server:
    build: .
    image: great-chess-server:1.0.0
    restart: unless-stopped
    environment:
      PORT: "9277"
      HOST: "0.0.0.0"
      DATA_DIR: "/data"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-https://great-chess.entropydrivenmindset.win,https://gowanginc.github.io}"
      TRUST_PROXY: "1"
      TMPDIR: "/tmp"
      MAX_ROOMS: "${MAX_ROOMS:-200}"
    volumes:
      - great-chess-data:/data
    ports:
      - "127.0.0.1:9277:9277"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 256
    stop_grace_period: 10s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:9277/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    user: "0:0"
    command:
      - tunnel
      - --no-autoupdate
      - --config
      - /etc/cloudflared/config.yml
      - run
    volumes:
      - ./tunnel-config.yml:/etc/cloudflared/config.yml:ro
      - ./tunnel-credentials.json:/etc/cloudflared/credentials.json:ro
    depends_on:
      server:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 128
    stop_grace_period: 10s

volumes:
  great-chess-data:
